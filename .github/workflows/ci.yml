name: Release images

# Octopilot pipeline. main: lint, test and an integration build of the controller
# image and its Helm chart (ttl.sh). A v* tag (Trigger Release, release.yml) creates
# the GitHub Release and publishes that exact image, by digest, and the chart to
# ghcr.io/octopilot (secret-manager-controller, secret-manager-controller-chart).
#
# Public repository: this workflow has no pull_request trigger, so nothing here runs
# for a fork and the self-hosted runners only ever run code from main and v* tags.
# Pull requests get pr.yml on GitHub-hosted runners with no credentials, and workflow
# runs of outside contributors need approval (repository setting).
on:
  push:
    branches: [main]
    tags: ["v*"]
    # main builds only when something that goes into the image changed. GitHub does
    # not apply path filters to tag pushes, so every v* tag builds and releases.
    paths-ignore:
      - VERSION
      - "**/*.md"
      - docs/**
      - docs-site/**
      - examples/**
      - tasks/**
      - Tiltfile
      - kind-config.yaml
  workflow_dispatch:

concurrency:
  group: secret-manager-controller-release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Octopilot
    # The reusable workflow's release job requests contents: write; a caller
    # granting less fails at startup.
    permissions:
      contents: write
      packages: write
      id-token: write
      pull-requests: write
      actions: write # trims old run artifacts (keep_artifacts)
    uses: octopilot/actions/.github/workflows/pipeline.yml@main
    with:
      integration: false
      # Same op as sesame-idam: it passes Skaffold buildArgs to Dockerfile builds.
      op_version: v1.2.2
      # Integration artifacts: ttl.sh, the pipeline's default (integration_registry
      # empty). Released images: ghcr.io/octopilot.
      release_to_ghcr: true
      # ms02 ARC runners, the octopilot org's scale set (shared-gitops-k8s-cluster,
      # runner group ms02: this repository only). push/tag/dispatch only, see the
      # header. They reach the release-notes model and share the sccache store.
      runner: '["self-hosted", "linux", "x64", "octopilot"]'
      sccache: true
      # The image build and push stay on a GitHub-hosted runner: ms02's uplink is
      # slow and PriceWhisperer's releases need it.
      artifacts_runner: ubuntu-24.04
      # Release notes from our own model through the Cylon LLM gateway on ms02, as
      # PriceWhisperer does (key: secret RELEASE_NOTES_API_KEY). If it is down the
      # notes fall back to GitHub's generated ones and the release goes ahead.
      release_notes_provider: openai
      release_notes_base_url: http://10.177.76.236/v1
      release_notes_model: Qwen/Qwen3.8-27B-FP8
    secrets:
      RELEASE_NOTES_API_KEY: ${{ secrets.RELEASE_NOTES_API_KEY }}
