name: Pull request

# Checks for pull requests, including forks: no secrets, read-only token,
# GitHub-hosted runner. Builds and releases run only from main and v* tags (ci.yml).
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: secret-manager-controller-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  rust:
    name: Format, build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: cargo check
        run: cargo check --workspace --all-targets --locked
      - name: Tests (installs the pinned sops)
        run: ./hack/test.sh
      - name: CRD manifest matches the Rust types
        run: |
          cargo run --locked -p controller --bin crdgen > /tmp/crd.yaml
          diff -u config/crd/secretmanagerconfig.yaml /tmp/crd.yaml
