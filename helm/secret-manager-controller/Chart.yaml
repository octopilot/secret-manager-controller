apiVersion: v2
name: secret-manager-controller
description: Syncs SOPS-encrypted secrets from a GitOps source (Flux, ArgoCD) to cloud secret managers (GCP, AWS, Azure) and OpenBao.
type: application
# version and appVersion are the release version: Trigger Release (release.yml) sets
# both with VERSION, so chart X.Y.Z deploys image vX.Y.Z unless image.tag says otherwise.
version: 0.1.4
appVersion: "0.1.4"
home: https://github.com/octopilot/secret-manager-controller
sources:
  - https://github.com/octopilot/secret-manager-controller
