{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "smc.fullname" . }}
  labels:
    {{- include "smc.labels" . | nindent 4 }}
rules:
  - apiGroups: ["secret-management.octopilot.io"]
    resources: ["secretmanagerconfigs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["secret-management.octopilot.io"]
    resources: ["secretmanagerconfigs/status"]
    verbs: ["update", "patch"]
  # Flux sources: read the artifact, watch for new revisions.
  - apiGroups: ["source.toolkit.fluxcd.io"]
    resources: ["gitrepositories"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["source.toolkit.fluxcd.io"]
    resources: ["gitrepositories/status"]
    verbs: ["get"]
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list", "watch"]
  # The SOPS private key is read from the namespace of each SecretManagerConfig.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "smc.fullname" . }}
  labels:
    {{- include "smc.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "smc.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "smc.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
# The controller's own settings.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "smc.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "smc.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "smc.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "smc.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "smc.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "smc.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
