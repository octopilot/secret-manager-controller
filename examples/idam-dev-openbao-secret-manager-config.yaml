---
# SecretManagerConfig for IDAM Service - Development Environment (OpenBao)
#
# Syncs SOPS-decrypted secrets from Git to an in-cluster OpenBao KV v2 engine
# using the Kubernetes auth method - the recommended approach for in-cluster
# workloads (no static credentials).
#
# Prerequisites:
# 1. OpenBao running in the cluster (e.g. at openbao.openbao.svc:8200) with a
#    KV v2 engine mounted at `secret`.
# 2. OpenBao Kubernetes auth method enabled, with a role `secret-manager-controller`
#    bound to the controller's ServiceAccount (secret-manager-controller in
#    octopilot-system) and a least-privilege policy. See config/openbao/README.md.
# 3. FluxCD GitRepository resource named "mysystem-manifests" in "flux-system".
#
# Directory structure expected:
# microservices/myapp/deployment-configuration/profiles/dev/
#   ├── kustomization.yaml      # Contains secretGenerator configuration
#   ├── application.properties
#   └── application.secrets.env  # SOPS-encrypted secrets

apiVersion: secret-management.octopilot.io/v1beta1
kind: SecretManagerConfig
metadata:
  name: myapp-dev-secrets-openbao
  namespace: mysystem
spec:
  # Source reference - FluxCD GitRepository
  sourceRef:
    kind: GitRepository
    name: mysystem-manifests
    namespace: flux-system

  # OpenBao configuration
  provider:
    type: openbao
    openbao:
      # In-cluster OpenBao endpoint
      address: https://openbao.openbao.svc:8200
      # KV v2 mount (default: secret)
      mount: secret
      # Optional: OpenBao namespace (OpenBao 2.6+)
      # namespace: team-a
      # Optional: custom CA for TLS verification (Kubernetes Secret + key)
      # tlsCaSecretRef:
      #   name: openbao-ca
      #   key: ca.crt
      # Kubernetes auth: the controller's ServiceAccount JWT is exchanged for a
      # short-lived OpenBao token. This is the only supported auth method.
      auth:
        authType: kubernetes
        role: secret-manager-controller
        # Optional: override the projected ServiceAccount token path
        # serviceAccountTokenPath: /var/run/secrets/openbao/token

  # Secrets sync configuration
  secrets:
    # Environment/profile name to sync (must match directory name under profiles/)
    environment: dev
    # Kustomize path - controller runs `kustomize build` here and extracts secrets
    kustomizePath: microservices/myapp/deployment-configuration/profiles/dev
    # Secret name prefix in OpenBao (secrets are written under <mount>/data/<prefix>/<key>)
    prefix: myapp-dev
    # Optional: secret suffix
    # suffix: -v2
