# Release shape, read by Octopilot's detect-contexts and built by `op` in the
# pipeline (.github/workflows/ci.yml). Tilt does not read this file: the dev images
# (pact mock servers, docs site, postgres manager) are built by the Tiltfile.
#
# One artifact: the controller. It is a Dockerfile build, not a buildpack, because
# the controller shells out to sops, gpg and kustomize, which the image must carry.
# Integration builds go to ttl.sh; a v* tag copies the tested image by digest to
# ghcr.io/octopilot/secret-manager-controller:<version>.
apiVersion: skaffold/v4beta7
kind: Config
metadata:
  name: secret-manager-controller
build:
  local:
    useBuildkit: true
  artifacts:
    - image: ghcr.io/octopilot/secret-manager-controller
      context: .
      docker:
        dockerfile: dockerfiles/Dockerfile.controller
